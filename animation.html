    <div id="container">
        <div id="main-content">
            <h2>Проста анімація</h2>
            <div id="box"></div>
            <div class="btns">
                <button onclick="start()">Старт</button>
                <button onclick="stop()">Стоп</button>
                <button onclick="reset()">Скинути</button>
            </div>
        </div>
    </div>

    <script>
        let box = document.getElementById('box');
        let pos = 0;
        let timer = null;

        function start() {
            if (!timer) {
                timer = setInterval(() => {
                    pos += 5;
                    box.style.left = pos + 'px';
                }, 30);
            }
        }

        function stop() {
            clearInterval(timer);
            timer = null;
        }

        function reset() {
            stop();
            pos = 0;
            box.style.left = '0px';
        }
    </script>
</body>
